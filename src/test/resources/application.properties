# Test configuration. The datasource is provided by Testcontainers (@ServiceConnection);
# Flyway runs the Foundation migration against the container on startup.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Test-only JWT + crypto keys (independent of any real secret).
codementor.security.jwt.issuer=codementor-ai-test
codementor.security.jwt.secret-base64=8euJRHXTSgfBeaaIt9oTdM7FsZkt3b6dRzZ2sQBJvvP73gdFE3QpM45EzYPVdVa/
codementor.security.jwt.access-token-ttl=15m
codementor.security.jwt.refresh-token-ttl=30d

codementor.crypto.key-version=v1
codementor.crypto.aes-key-base64=ka4qw0T8put3VSRD0Aj3+GeI3UhQLEhvbSd7bYd4ejc=

# Dev provisioning endpoint enabled by default in tests (a dedicated test overrides it to false).
codementor.auth.dev-provisioning-enabled=true

# GitHub integration: test placeholders. The GitHub HTTP clients are replaced by mocks in web ITs,
# so these URLs are never actually called. The real verifier (github) is used with a mocked client.
codementor.github.client-id=test-client-id
codementor.github.client-secret=test-client-secret
codementor.github.redirect-uri=http://localhost/api/auth/github/callback
codementor.github.scopes=repo,read:user,user:email
codementor.github.api-base-url=http://localhost/github-api
codementor.github.web-base-url=http://localhost/github-web
codementor.github.access-verifier=github

# Repository snapshot limits for tests: small per-file cap so the oversize-skip path is exercised.
codementor.repository.snapshot.max-file-size-bytes=1024
codementor.repository.snapshot.max-total-bytes=10485760
codementor.repository.snapshot.max-file-count=2000
codementor.repository.snapshot.workspace-root=${java.io.tmpdir}/codementor-ai-test/workspaces

# Code analysis limits for tests: small per-file cap so the oversize-skip path is exercised.
codementor.code-analysis.max-file-size-bytes=1024
codementor.code-analysis.max-total-input-bytes=1048576
codementor.code-analysis.max-file-count=200

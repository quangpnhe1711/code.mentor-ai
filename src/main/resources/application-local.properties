# Local developer profile for trying the API against Docker Compose PostgreSQL.
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/codementor_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:codementor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:codementor}

codementor.auth.dev-provisioning-enabled=true
codementor.github.access-verifier=permissive
codementor.review.worker.enabled=true

# --- Real "Continue with GitHub" login (optional) ---
# Local dev sign-in already works without any of this. To make the GitHub button work too:
#   1. Create a GitHub OAuth App: https://github.com/settings/developers -> New OAuth App
#      - Homepage URL:                http://localhost:5173
#      - Authorization callback URL:  http://localhost:8080/api/auth/github/callback
#   2. Uncomment the two lines below and paste the Client ID / Client secret from that app.
#   3. Restart the backend. The callback will redirect back to the SPA at frontend-redirect-uri.
codementor.github.client-id=Ov23liqeoLv62gn1bY0B
codementor.github.client-secret=cf985caccf1f0a071fdf16c953edd23559101231

# --- Real AI review via Google Gemini (OpenAI-compatible endpoint) ---
# The client appends /chat/completions to base-url, so base-url must be the Gemini OpenAI base
# (no trailing /v1). Provider MUST be exactly OPENAI_COMPATIBLE (case-sensitive).
codementor.review.ai.provider=OPENAI_COMPATIBLE
codementor.review.ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
codementor.review.ai.model=gemini-3.1-flash-lite
# Supply the Gemini API key WITHOUT committing it. Preferred: set env var before running the backend:
#   $env:CODEMENTOR_REVIEW_AI_API_KEY="AIza..."   (PowerShell)  then run mvnw spring-boot:run
# (Env vars override this file via Spring relaxed binding. Leave the line below blank.)
codementor.review.ai.api-key=${CODEMENTOR_REVIEW_AI_API_KEY:}
# Depth vs cost: send more of the repo to the model (Gemini's context is large). Raise for deeper
# reviews, lower if you hit rate/token limits. Defaults (application.properties) are 30 / 8000.
codementor.review.ai.max-files=80
codementor.review.ai.max-chars-per-file=24000

logging.level.com.lvn.codementor.ai=INFO

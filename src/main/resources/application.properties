spring.application.name=codementor.ai

# Flyway owns the schema (ADR-003); Hibernate never creates or alters DDL (doc 14 §4).
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
logging.level.org.springframework.web.client=INFO

# Datasource is supplied per environment (e.g. env vars / a local PostgreSQL).
# Integration tests provide it automatically via Testcontainers @ServiceConnection.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/codementor_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:codementor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:codementor}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Platform JWT (ADR-009) ---
# TBD: lifetimes are placeholders; signing-key management is unresolved (doc 14 §6.2).
# DEV ONLY secret — in production this MUST come from a secret manager, never a properties file.
codementor.security.jwt.issuer=codementor-ai
codementor.security.jwt.secret-base64=8euJRHXTSgfBeaaIt9oTdM7FsZkt3b6dRzZ2sQBJvvP73gdFE3QpM45EzYPVdVa/
codementor.security.jwt.access-token-ttl=15m
codementor.security.jwt.refresh-token-ttl=30d

# --- Dev-only provisioning endpoint (Part B) ---
# When true, exposes the PUBLIC, unauthenticated POST /api/auth/github/provision/dev, which mints
# platform tokens without a real GitHub OAuth exchange. Disabled by default (secure by default);
# enable it explicitly only in local/dev. MUST never be true in production.
codementor.auth.dev-provisioning-enabled=true

# --- GitHub integration (real OAuth + API) ---
# DEV/PLACEHOLDER values — real client id/secret MUST come from a secret manager, never committed.
# The client secret is used only server-side for the code->token exchange and is never returned.
codementor.github.client-id=Ov23liqeoLv62gn1bY0B
codementor.github.client-secret=cf985caccf1f0a071fdf16c953edd23559101231
codementor.github.redirect-uri=http://localhost:8080/api/auth/github/callback
# After a successful OAuth exchange the callback redirects the browser here with the platform token in
# the URL fragment (#token=...&org=...). This is the SPA route that consumes it.
codementor.github.frontend-redirect-uri=http://localhost:5173/auth/callback
codementor.github.scopes=repo,read:user,user:email
codementor.github.api-base-url=https://api.github.com
codementor.github.web-base-url=https://github.com
# Repository-import access verifier: "github" (default, real) or "permissive" (local dev only).
codementor.github.access-verifier=github

# --- GitHub webhook intake (FR-016) ---
# DEV ONLY secret. Production must provide this from a secret manager and configure the same value in GitHub.
codementor.webhooks.github.secret=changeme-webhook-secret

# --- Repository snapshot (clone + inventory) limits ---
codementor.repository.snapshot.max-file-size-bytes=262144
codementor.repository.snapshot.max-total-bytes=10485760
codementor.repository.snapshot.max-file-count=2000
codementor.repository.snapshot.workspace-root=${java.io.tmpdir}/codementor-ai/workspaces

# --- Code analysis (sanitized review-input build) limits ---
codementor.code-analysis.max-file-size-bytes=262144
codementor.code-analysis.max-total-input-bytes=1048576
codementor.code-analysis.max-file-count=200

# --- Review execution worker ---
# Local in-process queue worker. It drains QUEUED review jobs with the same execution pipeline as the
# manual /run endpoint; external queue infrastructure can replace this adapter later.
codementor.review.worker.enabled=true
codementor.review.worker.batch-size=5
codementor.review.worker.fixed-delay-ms=5000
codementor.review.worker.max-attempts=3
codementor.review.worker.retry-backoff-ms=30000

# --- Review AI provider ---
# LOCAL keeps the deterministic analyzer; OPENAI_COMPATIBLE calls {base-url}/chat/completions.
# base-url must include the provider's version segment (OpenAI: .../v1, Gemini: .../v1beta/openai).
# API keys must come from a secret manager/environment in real deployments.
codementor.review.ai.provider=LOCAL
codementor.review.ai.model=deterministic-review-analyzer
codementor.review.ai.prompt-version=review-local-v1
codementor.review.ai.base-url=https://api.openai.com/v1
codementor.review.ai.api-key=
codementor.review.ai.max-files=30
codementor.review.ai.max-chars-per-file=8000

# --- Provider-token encryption (ADR-011) ---
# TBD: key-management backend and rotation policy unresolved (doc 14 §7).
# DEV ONLY AES-256 key — in production this MUST come from a KMS/secret manager.
codementor.crypto.key-version=v1
codementor.crypto.aes-key-base64=ka4qw0T8put3VSRD0Aj3+GeI3UhQLEhvbSd7bYd4ejc=
